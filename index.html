<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@macrostrat/d3-timescale demo</title>
    <meta
      name="description"
      content="Demo of @macrostrat/d3-timescale, an interactive ICS geologic timescale built with d3."
    />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        max-width: 1000px;
        margin: 0 auto;
        padding: 1rem;
      }

      a:hover {
        color: steelblue;
      }
    </style>
  </head>
  <body>
    <h1>
      @macrostrat/d3-timescale
      <a
        href="https://github.com/UW-Macrostrat/geo-timescale/"
        title="Visit GitHub repository"
        rel="noopener"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          aria-label="GitHub"
          role="img"
          width="25"
          viewBox="0 0 512 512"
        >
          <rect width="512" height="512" rx="15%" fill="currentColor" />
          <path
            fill="#fff"
            d="M335 499c14 0 12 17 12 17H165s-2-17 12-17c13 0 16-6 16-12l-1-50c-71 16-86-28-86-28-12-30-28-37-28-37-24-16 1-16 1-16 26 2 40 26 40 26 22 39 59 28 74 22 2-17 9-28 16-35-57-6-116-28-116-126 0-28 10-51 26-69-3-6-11-32 3-67 0 0 21-7 70 26 42-12 86-12 128 0 49-33 70-26 70-26 14 35 6 61 3 67 16 18 26 41 26 69 0 98-60 120-117 126 10 8 18 24 18 48l-1 70c0 6 3 12 16 12z"
          />
        </svg>
      </a>
    </h1>
    <p>
      An interactive ICS geologic timescale. Click an interval to zoom in,
      click it again to zoom out, drag to pan.
    </p>

    <h2>Full width</h2>
    <div id="geoTimeFullWidth"></div>

    <h2>In Dutch, custom width &amp; height (500px by 250px)</h2>
    <div id="geoTimeSmall" style="width: 500px"></div>

    <script type="importmap">
      {
        "imports": {
          "d3-hierarchy": "https://esm.sh/d3-hierarchy@3",
          "d3-selection": "https://esm.sh/d3-selection@3",
          "d3-transition": "https://esm.sh/d3-transition@3",
          "d3-zoom": "https://esm.sh/d3-zoom@3"
        }
      }
    </script>
    <script type="module">
      import { geoTimescale } from "./src/index.js";

      geoTimescale("#geoTimeFullWidth");

      const response = await fetch("./src/intervals.nl.json");
      if (!response.ok) {
        throw new Error(
          `Loading intervals.nl.json failed: ${response.status} ${response.statusText}`
        );
      }
      const dutchIntervals = await response.json();
      geoTimescale("#geoTimeSmall", {
        width: 500,
        height: 250,
        intervals: dutchIntervals,
      });
    </script>
  </body>
</html>
